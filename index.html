<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 4 Day 2 — Flex Layouts + createElement</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Colors picked from the poster */
    :root {
      --portal-green: #97ce4c;
      --rick-blue: #44c8e8;
      --morty-yellow: #f0e14a;
      --summer-pink: #e868c8;
      --space-dark: #0d1f22;
      --space-teal: #1f3d3d;
      --card-dark: #16292b;
    }

    body {
      color: #e8f4f0;
      background: linear-gradient(180deg, var(--space-dark) 0%, var(--space-teal) 55%, #5a2a4a 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    h1 {
      font-family: "Creepster", cursive;
      color: var(--rick-blue);
      font-size: 2.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 6px var(--portal-green), 0 0 18px var(--portal-green);
    }

     

</style>
</head>
<body>

    <main class="container py-5">
  <h1 class="mb-4 text-center">Rick and Morty Characters</h1>
  <p id="status" class="fw-bold"></p>
  <div id="results" class="row g-3 mb-4"></div>
  <div class="d-flex justify-content-between align-items-center">
    <button id="prev-btn" class="btn btn-outline-info">← Prev</button>
    <span id="page-label" class="fw-bold text-success"></span>
    <button id="next-btn" class="btn btn-info">Next →</button>
  </div>
</main>
<script src="script.js"></script>

</body>
